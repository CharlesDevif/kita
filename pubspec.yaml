name: kita
description: "Kita — Compagnon IA mobile d'assistance au handicap"
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.1.0

  # Styling
  mix: ^1.7.0

  # Database (encrypted)
  drift: ^2.31.0
  sqlite3: ^2.9.4
  sqlcipher_flutter_libs: ^0.6.8

  # Secure storage
  flutter_secure_storage: ^10.0.0

  # I/O - Speech
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

  # I/O - Camera
  camera: ^0.11.4

  # I/O - Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # I/O - Motion
  sensors_plus: ^7.0.0

  # I/O - Background service
  flutter_foreground_task: ^9.2.0

  # I/O - Battery
  battery_plus: ^7.0.0

  # Network
  http: ^1.4.0

  # Plugin system
  yaml: ^3.1.3

  # ML / AI local
  tflite_flutter: ^0.12.1
  google_mlkit_object_detection: ^0.15.1

  # Image processing
  image: ^4.8.0

  # Utils
  path_provider: ^2.1.5
  path: ^1.9.0
  permission_handler: ^12.0.1

  # Serialization annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.3
  drift_dev: ^2.31.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0

  # Linting
  riverpod_lint: ^3.1.3

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
