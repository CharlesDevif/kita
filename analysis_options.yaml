include: package:flutter_lints/flutter.yaml

# Dart 3.10+ plugin system (replaces custom_lint)
plugins:
  riverpod_lint: ^3.1.3

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "lib/generated/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
