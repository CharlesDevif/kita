include: package:flutter_lints/flutter.yaml

# Dart 3.10+ plugin system (replaces custom_lint)
plugins:
  riverpod_lint:
    version: ^3.1.3
    diagnostics:
      # Kita n'utilise aucun ProviderScope imbriqué en production : tous les
      # providers sont des singletons keepAlive au scope racine. Ces deux
      # règles n'apportent que des faux positifs ici (elles se déclenchent sur
      # les overrides de test du graphe DB et cascadent en annotations
      # @Dependencies sur la moitié des widgets). Non supprimables par
      # `// ignore` (limitation du plugin system) → désactivées globalement.
      scoped_providers_should_specify_dependencies: false
      provider_dependencies: false

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "lib/generated/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
