name: Build iOS

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Build environment (dev/staging/prod)'
        required: false
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS (no codesign)
        run: flutter build ipa --release --no-codesign --dart-define=ENV=${{ inputs.env || 'prod' }}

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-${{ inputs.env || 'prod' }}
          path: build/ios/archive/
          retention-days: 30
