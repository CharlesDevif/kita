name: Build Android

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Build environment (dev/staging/prod)'
        required: false
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=ENV=${{ inputs.env || 'prod' }}

      - name: Build AAB (release)
        run: flutter build appbundle --release --dart-define=ENV=${{ inputs.env || 'prod' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.env || 'prod' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ inputs.env || 'prod' }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
