name: "Demande de fonctionnalite"
description: "Proposer une nouvelle fonctionnalite pour Kita"
title: "[Feature] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer une amelioration pour Kita ! Decrivez votre idee le plus
        clairement possible pour nous aider a evaluer et prioriser cette demande.

  - type: checkboxes
    id: existing-search
    attributes:
      label: "Verification prealable"
      options:
        - label: "J'ai recherche dans les issues existantes et cette fonctionnalite n'a pas encore ete proposee"
          required: true

  - type: textarea
    id: description
    attributes:
      label: "Description de la fonctionnalite"
      description: "Decrivez clairement la fonctionnalite que vous aimeriez voir ajoutee."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: "Cas d'utilisation"
      description: "Quel probleme cette fonctionnalite resoudrait ? Dans quel contexte en auriez-vous besoin ?"
      placeholder: "En tant que [persona], je voudrais [action] afin de [benefice]..."
    validations:
      required: true

  - type: dropdown
    id: persona
    attributes:
      label: "Persona concernee"
      description: "Quel profil utilisateur beneficierait le plus de cette fonctionnalite ?"
      multiple: true
      options:
        - "Utilisateur aveugle / malvoyant"
        - "Utilisateur sourd / malentendant"
        - "Utilisateur avec handicap cognitif"
        - "Utilisateur avec handicap moteur"
        - "Aidant / accompagnant"
        - "Tous les utilisateurs"
    validations:
      required: true

  - type: textarea
    id: accessibility-impact
    attributes:
      label: "Impact sur l'accessibilite"
      description: "Comment cette fonctionnalite ameliorerait l'accessibilite de Kita ?"
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "Solution proposee"
      description: "Si vous avez une idee de la maniere dont cette fonctionnalite pourrait etre implementee, decrivez-la ici."

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives envisagees"
      description: "Avez-vous envisage d'autres solutions ou contournements ?"

  - type: textarea
    id: additional-context
    attributes:
      label: "Contexte supplementaire"
      description: "Toute autre information, maquette ou capture d'ecran utile."
